<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מכ"ם מצלמה</title>
<style>
  :root{
    --green: #29ff7a;
    --green-dim: #0f7a3c;
    --red: #ff3b3b;
    --bg: #030604;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg);
    font-family:'Courier New', ui-monospace, monospace;
    overflow:hidden;
    overscroll-behavior:none;
  }
  #stage{
    position:fixed; inset:0;
    background:#000;
  }
  video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter: saturate(0.6) contrast(1.05) brightness(0.9);
  }
  canvas#overlay{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    mix-blend-mode: screen;
  }
  /* HUD corner brackets */
  .corner{
    position:absolute; width:28px; height:28px;
    border-color:var(--green); opacity:.75;
    filter: drop-shadow(0 0 4px var(--green));
    pointer-events:none;
  }
  .tl{top:14px; left:14px; border-top:2px solid; border-right:2px solid;}
  .tr{top:14px; right:14px; border-top:2px solid; border-left:2px solid;}
  .bl{bottom:14px; left:14px; border-bottom:2px solid; border-right:2px solid;}
  .br{bottom:14px; right:14px; border-bottom:2px solid; border-left:2px solid;}

  #status{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    color:var(--green); font-size:13px; letter-spacing:2px;
    text-shadow:0 0 6px var(--green);
    pointer-events:none; text-align:center;
    text-transform:uppercase;
  }
  #alertText{
    position:absolute; bottom:64px; left:50%; transform:translateX(-50%);
    color:var(--red); font-size:15px; letter-spacing:3px;
    text-shadow:0 0 10px var(--red);
    opacity:0; transition:opacity .15s;
    pointer-events:none; font-weight:bold;
  }
  #alertText.show{opacity:1;}

  #startOverlay{
    position:fixed; inset:0; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; z-index:10; text-align:center; padding:24px;
  }
  #startOverlay h1{
    color:var(--green); font-size:20px; letter-spacing:3px; margin:0;
    text-shadow:0 0 8px var(--green); text-transform:uppercase;
  }
  #startOverlay p{
    color:var(--green-dim); font-size:12px; max-width:280px; line-height:1.6; margin:0;
  }
  #startBtn{
    background:transparent; color:var(--green); border:1px solid var(--green);
    padding:14px 34px; font-size:14px; letter-spacing:3px;
    text-transform:uppercase; font-family:inherit; cursor:pointer;
    box-shadow:0 0 12px rgba(41,255,122,.25);
  }
  #startBtn:active{ background:rgba(41,255,122,.15); }
  #errMsg{color:var(--red); font-size:12px; max-width:280px; display:none;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="startOverlay">
  <h1>מכ"ם — זיהוי תנועה</h1>
  <p>המצלמה תסרוק את השטח מולה. סיבוב ירוק ימשוך על המסך, וכל תזוזה שתיכנס לפריים תסומן באדום ותשמיע צפצוף.</p>
  <button id="startBtn">הפעל מכ"ם</button>
  <p id="errMsg"></p>
</div>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="status">סורק...</div>
  <div id="alertText">אובייקט זוהה</div>
</div>

<script>
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const errMsg = document.getElementById('errMsg');
const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const alertText = document.getElementById('alertText');
const statusEl = document.getElementById('status');

let audioCtx = null;
let w = 0, h = 0;
let sweepAngle = 0;
let sweepDir = 1;

// offscreen low-res buffer for motion detection
const PW = 64, PH = 48;
const proc = document.createElement('canvas');
proc.width = PW; proc.height = PH;
const pctx = proc.getContext('2d', { willReadFrequently: true });
let prevFrame = null;

let lastBeep = 0;
let detectBox = null; // {x,y,w,h} in canvas space
let detectFade = 0;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);

function beep(){
  const now = performance.now();
  if (now - lastBeep < 550) return; // cooldown
  lastBeep = now;
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.2);
}

function drawSweep(){
  // radar sweep centered above bottom-middle, semicircle 0-180deg oscillating
  const cx = w / 2;
  const cy = h * 0.62;
  const radius = Math.max(w, h) * 0.55;

  // faint fixed arc guide
  ctx.save();
  ctx.strokeStyle = 'rgba(41,255,122,0.15)';
  ctx.lineWidth = 1;
  for (let r = radius * 0.33; r <= radius; r += radius * 0.33) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI, 2 * Math.PI);
    ctx.stroke();
  }
  ctx.restore();

  // sweep beam with trailing fade
  const beamAngle = Math.PI + (sweepAngle * Math.PI / 180); // 180deg -> 360deg range (upper half)
  const grad = ctx.createConicGradient
    ? null : null;

  ctx.save();
  ctx.translate(cx, cy);
  const trail = 40; // degrees of trail
  const steps = 24;
  for (let i = 0; i < steps; i++) {
    const t = i / steps;
    const a = beamAngle - (sweepDir * trail * Math.PI / 180) * t;
    const alpha = (1 - t) * 0.35;
    ctx.strokeStyle = `rgba(41,255,122,${alpha})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(radius * Math.cos(a), radius * Math.sin(a));
    ctx.stroke();
  }
  // bright leading line
  ctx.strokeStyle = 'rgba(200,255,220,0.9)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#29ff7a';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(radius * Math.cos(beamAngle), radius * Math.sin(beamAngle));
  ctx.stroke();
  ctx.restore();

  sweepAngle += sweepDir * 2.2;
  if (sweepAngle >= 180) { sweepAngle = 180; sweepDir = -1; }
  if (sweepAngle <= 0) { sweepAngle = 0; sweepDir = 1; }
}

function detectMotion(){
  pctx.drawImage(video, 0, 0, PW, PH);
  const frame = pctx.getImageData(0, 0, PW, PH);
  const data = frame.data;

  if (!prevFrame) { prevFrame = data.slice(); return; }

  let minX = PW, minY = PH, maxX = 0, maxY = 0;
  let changedPixels = 0;
  const threshold = 32;

  for (let y = 0; y < PH; y++) {
    for (let x = 0; x < PW; x++) {
      const i = (y * PW + x) * 4;
      const diff = Math.abs(data[i] - prevFrame[i]) +
                   Math.abs(data[i+1] - prevFrame[i+1]) +
                   Math.abs(data[i+2] - prevFrame[i+2]);
      if (diff > threshold * 3) {
        changedPixels++;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  prevFrame = data.slice();

  const minPixels = 18; // noise floor
  if (changedPixels >= minPixels) {
    const sx = w / PW, sy = h / PH;
    detectBox = {
      x: minX * sx,
      y: minY * sy,
      w: Math.max((maxX - minX) * sx, 24),
      h: Math.max((maxY - minY) * sy, 24)
    };
    detectFade = 1;
    beep();
    alertText.classList.add('show');
    statusEl.textContent = 'זוהתה תנועה';
  }
}

function drawDetection(){
  if (detectBox && detectFade > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, detectFade);
    ctx.strokeStyle = '#ff3b3b';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ff3b3b';
    ctx.shadowBlur = 14;
    const b = detectBox;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    // corner ticks
    const t = 10;
    ctx.beginPath();
    ctx.moveTo(b.x - t, b.y); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x, b.y - t);
    ctx.moveTo(b.x + b.w + t, b.y); ctx.lineTo(b.x + b.w, b.y); ctx.lineTo(b.x + b.w, b.y - t);
    ctx.moveTo(b.x - t, b.y + b.h); ctx.lineTo(b.x, b.y + b.h); ctx.lineTo(b.x, b.y + b.h + t);
    ctx.moveTo(b.x + b.w + t, b.y + b.h); ctx.lineTo(b.x + b.w, b.y + b.h); ctx.lineTo(b.x + b.w, b.y + b.h + t);
    ctx.stroke();
    ctx.restore();
    detectFade -= 0.02;
    if (detectFade <= 0) {
      alertText.classList.remove('show');
      statusEl.textContent = 'סורק...';
    }
  }
}

function loop(){
  ctx.clearRect(0, 0, w, h);
  drawSweep();
  drawDetection();
  requestAnimationFrame(loop);
}

async function start(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    resize();
    startOverlay.classList.add('hidden');
    loop();
    setInterval(detectMotion, 180); // ~5.5 checks/sec, keeps it light
  }catch(err){
    errMsg.style.display = 'block';
    errMsg.textContent = 'לא ניתן לגשת למצלמה: ' + err.message + ' — ודא שהאתר רץ תחת HTTPS או localhost ושאישרת הרשאת מצלמה.';
  }
}

startBtn.addEventListener('click', start);
</script>
</body>
</html>
